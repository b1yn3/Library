<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Library</title>
</head>
<body>
    <header>
        <h3>Library</h3>
        <button id="showDialog">Add Books</button>
        <dialog id="confirmDialog">
            <h3>Add Books</h3>
            <form method="dialog" id="dialogForm">
                <p>Title:</p>
                <input type="text" id="titleInput" required>
                <p>Author:</p>
                <input type="text" id="authorInput" required>
                <p>Pages:</p>
                <input type="number" id="pageInput" required min="1">
                <p>Read:</p>
                <select id="selectInput">
                    <option value="Read">Read</option>
                    <option value="Unread">Unread</option>
                </select>       
                <div class="form-buttons">
                    <button id="cancel-button" type="button" value="Cancel">Cancel</button>
                    <button id="submit-button" type="submit" value="Submit">Submit</button>
                </div>                       
            </form>
        </dialog>
    </header>
    <main>
        <article>
            <h4 class="bookTitle">Title</h4>
            <p class="bookAuthor">Author</p>
            <p class="bookPages">Pages</p>
            <p class="bookRead">Read</p>
        </article>

    </main>
    <script src="script.js"></script>
</body>
</html>
